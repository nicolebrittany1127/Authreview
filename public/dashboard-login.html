<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Login — Intake Auth Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #eeeae3;
    --card-bg: #ffffff;
    --text: #1a2433;
    --muted: #6b7280;
    --navy: #1a2433;
    --navy-hover: #0f1722;
    --border: #e2e0da;
    --error-bg: #fdecec;
    --error-text: #a02b2b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 40px 32px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.04);
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 26px;
    margin: 0 0 28px;
    text-align: center;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--muted);
  }
  input[type="email"], input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 15px;
    margin-bottom: 18px;
    background: #fafaf8;
  }
  input:focus { outline: 2px solid var(--navy); outline-offset: 1px; }
  button {
    width: 100%;
    padding: 13px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: var(--navy-hover); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .message {
    font-size: 13.5px;
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 18px;
    display: none;
  }
  .message.error { background: var(--error-bg); color: var(--error-text); display: block; }
  .message.info { background: #eef3fb; color: #234e8c; display: block; }
</style>
</head>
<body>

<div class="card">
  <h1>Dashboard access</h1>
  <div id="message" class="message"></div>
  <form id="login-form">
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username" required />
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required />
    <button type="submit" id="submit-btn">Sign in</button>
  </form>
</div>

<script>
  // Same Supabase project used by intake.html — copy the exact URL and anon
  // key from there so both stay in sync.
  const SUPABASE_URL = 'https://bfxlalbdaesoegvyyffd.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmeGxhbGJkYWVzb2Vndnl5ZmZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTA5MzcsImV4cCI6MjA5Nzk4NjkzN30.1Ft2bvqOhfb6fPjTfYzuR7fspSJWzhM0L3_wQODxZN4';

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById('login-form');
  const messageEl = document.getElementById('message');
  const submitBtn = document.getElementById('submit-btn');

  function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = 'message ' + type;
  }

  // If we got here after an idle timeout on the dashboard, say so.
  const params = new URLSearchParams(window.location.search);
  if (params.get('timeout') === '1') {
    showMessage('You were signed out after 15 minutes of inactivity. Please log back in.', 'info');
  }

  // Already signed in with an active profile? Skip straight to the dashboard.
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      window.location.href = 'dashboard.html';
    }
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      showMessage('Incorrect email or password.', 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
      return;
    }

    // Confirm there's an active profile before sending them into the
    // dashboard — a deactivated account should get a clear message here
    // rather than a confusing failure once inside.
    const { data: profile, error: profileErr } = await supabaseClient
      .from('profiles')
      .select('active, role')
      .eq('id', data.user.id)
      .single();

    if (profileErr || !profile) {
      showMessage('No dashboard profile is set up for this account yet.', 'error');
      await supabaseClient.auth.signOut();
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
      return;
    }

    if (!profile.active) {
      showMessage('This account has been deactivated.', 'error');
      await supabaseClient.auth.signOut();
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
      return;
    }

    window.location.href = 'dashboard.html';
  });
</script>

</body>
</html>
