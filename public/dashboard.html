<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Intake Auth Tracker — Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #eeeae3;
    --card-bg: #ffffff;
    --text: #1a2433;
    --muted: #6b7280;
    --navy: #1a2433;
    --navy-hover: #0f1722;
    --border: #e2e0da;
    --new-status: #2a5b8c;
    --new-status-bg: #e3edf7;
    --pending: #b8860b;
    --pending-bg: #fdf3dd;
    --approved: #1f7a4d;
    --approved-bg: #e3f5eb;
    --denied: #a02b2b;
    --denied-bg: #fdecec;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-family: Georgia, serif;
    font-size: 20px;
    margin: 0;
  }
  .user-info { display: flex; align-items: center; gap: 12px; font-size: 14px; }
  .badge {
    background: #c99842;
    color: #1a2433;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 3px 9px;
    border-radius: 20px;
    text-transform: uppercase;
  }
  .signout-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.35);
    color: #fff;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .signout-btn:hover { background: rgba(255,255,255,0.1); }

  main { max-width: 1180px; margin: 0 auto; padding: 28px; }

  #banner {
    display: none;
    padding: 12px 16px;
    border-radius: 6px;
    margin-bottom: 18px;
    font-size: 14px;
  }
  #banner.error { display: block; background: #fdecec; color: #a02b2b; }
  #banner.success { display: block; background: #e3f5eb; color: #1f7a4d; }

  .overview {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px;
    margin-bottom: 26px;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    cursor: pointer;
    transition: box-shadow 0.15s;
  }
  .stat-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .stat-card.active-filter { outline: 2px solid var(--navy); }
  .stat-num { font-size: 28px; font-weight: 700; font-family: Georgia, serif; }
  .stat-label { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .stat-card.expiring .stat-num { color: var(--denied); }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 16px;
  }
  .tabs { display: flex; gap: 4px; background: #e4e0d8; border-radius: 8px; padding: 3px; }
  .tab-btn {
    border: none;
    background: transparent;
    padding: 7px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--muted);
  }
  .tab-btn.active { background: #fff; color: var(--text); }

  select, input[type="text"] {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13.5px;
    background: #fff;
  }
  .spacer { flex: 1; }
  .btn {
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
  }
  .btn:hover { background: #f5f3ee; }

  table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  th, td { text-align: left; padding: 11px 14px; font-size: 13.5px; border-bottom: 1px solid var(--border); }
  th { background: #f6f4ef; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
  tr:last-child td { border-bottom: none; }
  tr.record-row:hover { background: #fafaf7; cursor: pointer; }

  .status-pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: capitalize; }
  .status-new { background: var(--new-status-bg); color: var(--new-status); }
  .status-pending { background: var(--pending-bg); color: var(--pending); }
  .status-approved { background: var(--approved-bg); color: var(--approved); }
  .status-denied { background: var(--denied-bg); color: var(--denied); }

  .claim-btn { font-size: 12px; padding: 4px 10px; }

  .empty-state { text-align: center; padding: 50px 20px; color: var(--muted); }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(20,20,20,0.45);
    align-items: flex-start;
    justify-content: center;
    overflow-y: auto;
    padding: 40px 16px;
    z-index: 50;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 10px;
    width: 100%;
    max-width: 640px;
    padding: 28px;
  }
  .modal h2 { font-family: Georgia, serif; margin: 0 0 4px; font-size: 21px; }
  .modal .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 8px; }
  .field-grid.full { grid-template-columns: 1fr; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .field .readonly { font-size: 14px; padding: 4px 0; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; font-family: inherit;
  }
  .field textarea { min-height: 70px; resize: vertical; }
  hr.section { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); margin-bottom: 12px; }
  .doc-links { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .doc-link {
    font-size: 12.5px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: #f6f4ef; cursor: pointer; color: var(--text);
  }
  .doc-link:hover { background: #efece4; }
  .modal-actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .btn-primary { background: var(--navy); color: #fff; border: none; }
  .btn-primary:hover { background: var(--navy-hover); }
  .btn-danger { background: #fff; color: var(--danger); border: 1px solid var(--danger); }
  .btn-danger:hover { background: #fdecec; }
  .btn-ghost { background: transparent; border: none; color: var(--muted); }
  .modal-error { background: #fdecec; color: #a02b2b; padding: 9px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 14px; display: none; }
  .danger-zone { border: 1px solid #f3cfc8; background: #fff8f7; border-radius: 8px; padding: 14px; margin-top: 20px; }
  .danger-zone .section-title { color: var(--danger); }
</style>
</head>
<body>

<header>
  <h1>Intake Auth Tracker</h1>
  <div class="user-info">
    <span id="user-name"></span>
    <span id="admin-badge" class="badge" style="display:none;">Admin</span>
    <button class="signout-btn" id="signout-btn">Sign out</button>
  </div>
</header>

<main>
  <div id="banner"></div>

  <div class="overview" id="overview"></div>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab-btn active" data-tab="active">Active</button>
      <button class="tab-btn" data-tab="discharged">Discharged</button>
    </div>
    <select id="status-filter">
      <option value="all">All statuses</option>
      <option value="new">New</option>
      <option value="pending">Pending</option>
      <option value="approved">Approved</option>
      <option value="denied">Denied</option>
    </select>
    <select id="assignee-filter" style="display:none;">
      <option value="all">All billers</option>
      <option value="unclaimed">Unclaimed</option>
    </select>
    <input type="text" id="search" placeholder="Search name or facility…" />
    <div class="spacer"></div>
    <button class="btn" id="export-btn">Export CSV</button>
    <button class="btn" id="refresh-btn">Refresh</button>
  </div>

  <table id="table">
    <thead>
      <tr>
        <th>Patient</th>
        <th>Facility</th>
        <th>Payer</th>
        <th>Status</th>
        <th>Assigned</th>
        <th>Auth dates</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
  <div class="empty-state" id="empty-state" style="display:none;">No records match the current filters.</div>
</main>

<!-- Record detail / edit modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title">Record</h2>
    <div class="sub" id="modal-sub"></div>
    <div class="modal-error" id="modal-error"></div>

    <div class="section-title">Patient</div>
    <div class="field-grid" id="readonly-fields"></div>

    <div id="doc-section"></div>

    <hr class="section" />
    <div class="section-title">Authorization</div>
    <div class="field-grid">
      <div class="field">
        <label>Status</label>
        <select id="f-status">
          <option value="new">New</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="denied">Denied</option>
        </select>
      </div>
      <div class="field">
        <label>Payer contact date</label>
        <input type="date" id="f-payer_contact_date" />
      </div>
      <div class="field">
        <label>Auth number</label>
        <input type="text" id="f-auth_number" />
      </div>
      <div class="field">
        <label>Units authorized</label>
        <input type="text" id="f-units_authorized" />
      </div>
      <div class="field">
        <label>Auth start date</label>
        <input type="date" id="f-auth_start_date" />
      </div>
      <div class="field">
        <label>Auth end date</label>
        <input type="date" id="f-auth_end_date" />
      </div>
    </div>
    <div class="field">
      <label>Denial reason <span style="font-weight:400;">(required if status is Denied)</span></label>
      <input type="text" id="f-denial_reason" />
    </div>
    <div class="field">
      <label>Internal notes</label>
      <textarea id="f-internal_notes"></textarea>
    </div>

    <div class="field" id="admin-reassign-wrap" style="display:none;">
      <label>Reassign to</label>
      <select id="f-reassign"></select>
    </div>
    <div id="claim-wrap"></div>

    <div class="modal-actions">
      <button class="btn btn-primary" id="save-btn">Save changes</button>
      <button class="btn" id="cancel-btn">Cancel</button>
      <div class="spacer"></div>
      <button class="btn" id="discharge-btn"></button>
    </div>

    <div class="danger-zone" id="danger-zone" style="display:none;">
      <div class="section-title">Danger zone</div>
      <p style="font-size:13px; color:var(--muted); margin:0 0 10px;">
        Permanently deletes this record from the database. Uploaded documents are not deleted. This cannot be undone.
      </p>
      <button class="btn btn-danger" id="delete-btn">Permanently delete record</button>
    </div>
  </div>
</div>

<script>
  // Same Supabase project as intake.html / dashboard-login.html.
  const SUPABASE_URL = 'https://bfxlalbdaesoegvyyffd.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmeGxhbGJkYWVzb2Vndnl5ZmZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTA5MzcsImV4cCI6MjA5Nzk4NjkzN30.1Ft2bvqOhfb6fPjTfYzuR7fspSJWzhM0L3_wQODxZN4';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const IDLE_LIMIT_MS = 15 * 60 * 1000; // 15 minutes
  let idleTimer = null;
  let currentUser = null;   // { id, name, role }
  let accessToken = null;
  let allRecords = [];
  let activeTab = 'active';
  let openRecordId = null;

  // ---------- Auth guard ----------
  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'dashboard-login.html';
      return;
    }
    accessToken = session.access_token;
    resetIdleTimer();
    await loadRecords();
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') {
      window.location.href = 'dashboard-login.html';
    }
  });

  document.getElementById('signout-btn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
  });

  function resetIdleTimer() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'dashboard-login.html?timeout=1';
    }, IDLE_LIMIT_MS);
  }
  ['mousemove', 'keydown', 'click', 'scroll'].forEach(evt =>
    document.addEventListener(evt, resetIdleTimer, { passive: true })
  );

  // ---------- API helper ----------
  async function api(path, options = {}) {
    const res = await fetch('/api/' + path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + accessToken,
        ...(options.headers || {}),
      },
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(body.error || ('Request failed (' + res.status + ')'));
    }
    return body;
  }

  function showBanner(text, type) {
    const el = document.getElementById('banner');
    el.textContent = text;
    el.className = type;
    if (type === 'success') setTimeout(() => { el.className = ''; }, 4000);
  }

  // ---------- Load + render ----------
  async function loadRecords() {
    try {
      const { records, user } = await api('list-authorizations');
      allRecords = records;
      currentUser = user;
      document.getElementById('user-name').textContent = user.name || '';
      document.getElementById('admin-badge').style.display = user.role === 'admin' ? 'inline-block' : 'none';
      document.getElementById('assignee-filter').style.display = user.role === 'admin' ? 'inline-block' : 'none';
      populateReassignOptions();
      populateAssigneeFilter();
      renderOverview();
      renderTable();
    } catch (err) {
      showBanner(err.message, 'error');
    }
  }

  function populateAssigneeFilter() {
    const sel = document.getElementById('assignee-filter');
    const known = new Map();
    allRecords.forEach(r => {
      if (r.assigned_biller_id && r.assigned_biller) known.set(r.assigned_biller_id, r.assigned_biller);
    });
    sel.innerHTML = '<option value="all">All billers</option><option value="unclaimed">Unclaimed</option>';
    known.forEach((name, id) => {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = name;
      sel.appendChild(opt);
    });
  }

  // Built from whoever already appears assigned in the loaded records —
  // there's no dedicated "list billers" endpoint, so a biller with zero
  // assigned records won't appear here until they're assigned or claim one.
  function populateReassignOptions() {
    const sel = document.getElementById('f-reassign');
    const known = new Map();
    allRecords.forEach(r => {
      if (r.assigned_biller_id && r.assigned_biller) known.set(r.assigned_biller_id, r.assigned_biller);
    });
    sel.innerHTML = '<option value="">— Unclaimed —</option>';
    known.forEach((name, id) => {
      const opt = document.createElement('option');
      opt.value = id;
      opt.dataset.name = name;
      opt.textContent = name;
      sel.appendChild(opt);
    });
  }

  function daysUntil(dateStr) {
    if (!dateStr) return null;
    const diff = new Date(dateStr) - new Date();
    return Math.ceil(diff / (1000 * 60 * 60 * 24));
  }

  function renderOverview() {
    const active = allRecords.filter(r => !r.discharged_at);
    const newCount = active.filter(r => r.status === 'new').length;
    const pending = active.filter(r => r.status === 'pending').length;
    const approved = active.filter(r => r.status === 'approved').length;
    const denied = active.filter(r => r.status === 'denied').length;
    const expiring = active.filter(r => {
      const d = daysUntil(r.auth_end_date);
      return d !== null && d >= 0 && d <= 7 && r.status === 'approved';
    }).length;

    const cards = [
      { key: 'new', label: 'New', num: newCount },
      { key: 'pending', label: 'Pending', num: pending },
      { key: 'approved', label: 'Approved', num: approved },
      { key: 'denied', label: 'Denied', num: denied },
      { key: 'expiring', label: 'Expiring in 7 days', num: expiring, expiring: true },
    ];
    const el = document.getElementById('overview');
    el.innerHTML = '';
    cards.forEach(c => {
      const div = document.createElement('div');
      div.className = 'stat-card' + (c.expiring ? ' expiring' : '');
      div.innerHTML = `<div class="stat-num">${c.num}</div><div class="stat-label">${c.label}</div>`;
      div.addEventListener('click', () => {
        activeTab = 'active';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === 'active'));
        if (c.key === 'expiring') {
          document.getElementById('status-filter').value = 'approved';
          window.__expiringOnly = true;
        } else {
          document.getElementById('status-filter').value = c.key;
          window.__expiringOnly = false;
        }
        renderTable();
      });
      el.appendChild(div);
    });
  }

  function getFiltered() {
    const statusFilter = document.getElementById('status-filter').value;
    const assigneeFilter = document.getElementById('assignee-filter').value;
    const search = document.getElementById('search').value.trim().toLowerCase();

    return allRecords.filter(r => {
      if (activeTab === 'active' && r.discharged_at) return false;
      if (activeTab === 'discharged' && !r.discharged_at) return false;
      if (statusFilter !== 'all' && r.status !== statusFilter) return false;
      if (window.__expiringOnly) {
        const d = daysUntil(r.auth_end_date);
        if (d === null || d < 0 || d > 7) return false;
      }
      if (assigneeFilter === 'unclaimed' && r.assigned_biller_id) return false;
      if (assigneeFilter !== 'all' && assigneeFilter !== 'unclaimed' && r.assigned_biller_id !== assigneeFilter) return false;
      if (search) {
        const hay = ((r.first_name || '') + ' ' + (r.last_name || '') + ' ' + (r.facility_name || '')).toLowerCase();
        if (!hay.includes(search)) return false;
      }
      return true;
    });
  }

  function renderTable() {
    const rows = getFiltered();
    const tbody = document.getElementById('table-body');
    tbody.innerHTML = '';
    document.getElementById('empty-state').style.display = rows.length ? 'none' : 'block';

    rows.forEach(r => {
      const tr = document.createElement('tr');
      tr.className = 'record-row';
      const authDates = (r.auth_start_date || r.auth_end_date)
        ? `${r.auth_start_date || '—'} → ${r.auth_end_date || '—'}`
        : '—';
      const canClaim = currentUser.role !== 'admin' && !r.assigned_biller_id;
      tr.innerHTML = `
        <td>${escapeHtml((r.first_name || '') + ' ' + (r.last_name || ''))}</td>
        <td>${escapeHtml(r.facility_name || '—')}</td>
        <td>${escapeHtml(r.payer || '—')}</td>
        <td><span class="status-pill status-${r.status}">${r.status}</span></td>
        <td>${escapeHtml(r.assigned_biller || '— unclaimed —')}</td>
        <td>${authDates}</td>
        <td>${canClaim ? '<button class="btn claim-btn" data-claim="' + r.id + '">Claim</button>' : ''}</td>
      `;
      tr.addEventListener('click', (e) => {
        if (e.target.dataset.claim) return; // handled separately
        openModal(r.id);
      });
      tbody.appendChild(tr);
      const claimBtn = tr.querySelector('[data-claim]');
      if (claimBtn) {
        claimBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          await claimRecord(r.id);
        });
      }
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function claimRecord(id) {
    try {
      await api('update-authorization', {
        method: 'PATCH',
        body: JSON.stringify({ id, assigned_biller_id: currentUser.id, assigned_biller: currentUser.name }),
      });
      showBanner('Record claimed.', 'success');
      await loadRecords();
    } catch (err) {
      showBanner(err.message, 'error');
    }
  }

  // ---------- Tabs / filters ----------
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      window.__expiringOnly = false;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
      renderTable();
    });
  });
  ['status-filter', 'assignee-filter', 'search'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => { window.__expiringOnly = false; renderTable(); });
  });
  document.getElementById('refresh-btn').addEventListener('click', loadRecords);

  // ---------- Export ----------
  document.getElementById('export-btn').addEventListener('click', () => {
    const rows = getFiltered();
    const cols = ['first_name','last_name','facility_name','payer','status','assigned_biller','auth_number','auth_start_date','auth_end_date','payer_contact_date','units_authorized','denial_reason'];
    const csv = [cols.join(',')].concat(
      rows.map(r => cols.map(c => '"' + String(r[c] ?? '').replace(/"/g, '""') + '"').join(','))
    ).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'authorizations-' + activeTab + '-' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
    URL.revokeObjectURL(url);
  });

  // ---------- Modal ----------
  function openModal(id) {
    const r = allRecords.find(x => x.id === id);
    if (!r) return;
    openRecordId = id;
    document.getElementById('modal-error').style.display = 'none';

    document.getElementById('modal-title').textContent = (r.first_name || '') + ' ' + (r.last_name || '');
    document.getElementById('modal-sub').textContent = (r.facility_name || 'No facility on file') + ' · ' + (r.payer || 'No payer on file');

    // Read-only patient fields — only rendered if present on the record,
    // since not every deployment populates every intake field.
    const readonly = document.getElementById('readonly-fields');
    readonly.innerHTML = '';
    const roFields = [
      ['date_of_birth', 'Date of birth'],
      ['member_id', 'Member ID'],
      ['primary_insurance', 'Primary insurance'],
      ['secondary_insurance', 'Secondary insurance'],
      ['level_of_care', 'Level of care'],
      ['review_type', 'Review type'],
      ['submitted_at', 'Submitted'],
    ];
    roFields.forEach(([key, label]) => {
      if (r[key] === undefined || r[key] === null || r[key] === '') return;
      const div = document.createElement('div');
      div.className = 'field';
      div.innerHTML = `<label>${label}</label><div class="readonly">${escapeHtml(String(r[key]))}</div>`;
      readonly.appendChild(div);
    });

    // Document links
    const docSection = document.getElementById('doc-section');
    const docs = [];
    if (r.attestation_doc_url) docs.push(['Attestation form', r.attestation_doc_url]);
    if (r.asam_doc_url) docs.push(['ASAM', r.asam_doc_url]);
    (r.additional_docs_urls || []).forEach((p, i) => docs.push(['Additional doc ' + (i + 1), p]));
    if (docs.length) {
      docSection.innerHTML = '<div class="section-title" style="margin-top:14px;">Documents</div><div class="doc-links" id="doc-links"></div>';
      const wrap = document.getElementById('doc-links');
      docs.forEach(([label, path]) => {
        const btn = document.createElement('button');
        btn.className = 'doc-link';
        btn.textContent = label;
        btn.addEventListener('click', async () => {
          btn.textContent = 'Opening…';
          try {
            const { url } = await api('get-document-url', { method: 'POST', body: JSON.stringify({ path }) });
            window.open(url, '_blank');
          } catch (err) {
            showBanner(err.message, 'error');
          }
          btn.textContent = label;
        });
        wrap.appendChild(btn);
      });
    } else {
      docSection.innerHTML = '';
    }

    // Editable fields
    document.getElementById('f-status').value = r.status || 'pending';
    document.getElementById('f-payer_contact_date').value = r.payer_contact_date || '';
    document.getElementById('f-auth_number').value = r.auth_number || '';
    document.getElementById('f-units_authorized').value = r.units_authorized || '';
    document.getElementById('f-auth_start_date').value = r.auth_start_date || '';
    document.getElementById('f-auth_end_date').value = r.auth_end_date || '';
    document.getElementById('f-denial_reason').value = r.denial_reason || '';
    document.getElementById('f-internal_notes').value = r.internal_notes || '';

    // Assignment control: admins get a reassign dropdown; billers get a
    // claim button only when the record is currently unclaimed.
    const adminWrap = document.getElementById('admin-reassign-wrap');
    const claimWrap = document.getElementById('claim-wrap');
    if (currentUser.role === 'admin') {
      adminWrap.style.display = 'block';
      claimWrap.innerHTML = '';
      document.getElementById('f-reassign').value = r.assigned_biller_id || '';
    } else {
      adminWrap.style.display = 'none';
      if (!r.assigned_biller_id) {
        claimWrap.innerHTML = '<button class="btn" id="modal-claim-btn">Claim this record</button>';
        document.getElementById('modal-claim-btn').addEventListener('click', async () => {
          await claimRecord(r.id);
          openModal(r.id);
        });
      } else {
        claimWrap.innerHTML = '';
      }
    }

    // Discharge / restore
    const dischargeBtn = document.getElementById('discharge-btn');
    if (r.discharged_at) {
      dischargeBtn.textContent = 'Restore to active';
      dischargeBtn.onclick = () => restoreRecord(r.id);
    } else {
      dischargeBtn.textContent = 'Discharge client';
      dischargeBtn.onclick = () => dischargeRecord(r.id);
    }

    // Danger zone — admin only
    document.getElementById('danger-zone').style.display = currentUser.role === 'admin' ? 'block' : 'none';

    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    openRecordId = null;
  }
  document.getElementById('cancel-btn').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'modal-overlay') closeModal();
  });

  document.getElementById('save-btn').addEventListener('click', async () => {
    const errEl = document.getElementById('modal-error');
    errEl.style.display = 'none';

    const patch = {
      id: openRecordId,
      status: document.getElementById('f-status').value,
      payer_contact_date: document.getElementById('f-payer_contact_date').value || null,
      auth_number: document.getElementById('f-auth_number').value || null,
      units_authorized: document.getElementById('f-units_authorized').value || null,
      auth_start_date: document.getElementById('f-auth_start_date').value || null,
      auth_end_date: document.getElementById('f-auth_end_date').value || null,
      denial_reason: document.getElementById('f-denial_reason').value || null,
      internal_notes: document.getElementById('f-internal_notes').value || null,
    };

    if (currentUser.role === 'admin') {
      const sel = document.getElementById('f-reassign');
      const opt = sel.options[sel.selectedIndex];
      patch.assigned_biller_id = sel.value || null;
      patch.assigned_biller = sel.value ? opt.dataset.name : null;
    }

    // Client-side heads-up matching the server's workflow gates — the
    // server is the real authority, this just avoids a round trip.
    if (patch.status === 'approved' && (!patch.auth_number || !patch.auth_start_date || !patch.auth_end_date)) {
      errEl.textContent = 'Approved status requires auth number, start date, and end date.';
      errEl.style.display = 'block';
      return;
    }
    if (patch.status === 'denied' && !patch.denial_reason) {
      errEl.textContent = 'Denial reason is required to mark a record Denied.';
      errEl.style.display = 'block';
      return;
    }

    try {
      await api('update-authorization', { method: 'PATCH', body: JSON.stringify(patch) });
      closeModal();
      showBanner('Changes saved.', 'success');
      await loadRecords();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
    }
  });

  async function dischargeRecord(id) {
    const reason = prompt('Reason for discharge (optional):') || null;
    try {
      await api('update-authorization', {
        method: 'PATCH',
        body: JSON.stringify({ id, discharged_at: new Date().toISOString(), discharge_reason: reason }),
      });
      closeModal();
      showBanner('Client discharged.', 'success');
      await loadRecords();
    } catch (err) {
      showBanner(err.message, 'error');
    }
  }

  async function restoreRecord(id) {
    try {
      await api('update-authorization', {
        method: 'PATCH',
        body: JSON.stringify({ id, discharged_at: null, discharge_reason: null }),
      });
      closeModal();
      showBanner('Record restored to active.', 'success');
      await loadRecords();
    } catch (err) {
      showBanner(err.message, 'error');
    }
  }

  document.getElementById('delete-btn').addEventListener('click', async () => {
    if (!confirm('Permanently delete this record? This cannot be undone. Uploaded documents will remain in storage.')) return;
    try {
      await api('delete-authorization', { method: 'DELETE', body: JSON.stringify({ id: openRecordId }) });
      closeModal();
      showBanner('Record permanently deleted.', 'success');
      await loadRecords();
    } catch (err) {
      showBanner(err.message, 'error');
    }
  });

  init();
</script>

</body>
</html>
